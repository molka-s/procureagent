services:
  postgres:
    image: postgres:16-alpine
    container_name: procureagent-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procure}
      POSTGRES_DB: ${POSTGRES_DB:-procureagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procure} -d ${POSTGRES_DB:-procureagent}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
